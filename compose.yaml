name: ai-video-sampling

services:
  db:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 512m
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    profiles: ["tools"]
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Missing POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./settings.json:/app/settings.json:ro
    networks:
      - backend
      - outbound
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  outbound:
